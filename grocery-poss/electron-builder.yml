appId: com.glosarypos.desktop

productName: Glosary POS

copyright: Copyright © 2026 Glosary POS

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - '**/*.node'

npmRebuild: true

win:
  executableName: GlosaryPoss

  target:
    - target: nsis
      arch:
        - x64

  icon: build/icon.ico

nsis:
  artifactName: '${productName}-Setup-${version}.${ext}'

  oneClick: false

  perMachine: false

  allowElevation: true

  allowToChangeInstallationDirectory: true

  createDesktopShortcut: always

  createStartMenuShortcut: true

  shortcutName: Glosary POS

  uninstallDisplayName: Glosary POS

  deleteAppDataOnUninstall: false

portable:
  artifactName: '${productName}-Portable-${version}.${ext}'

mac:
  category: public.app-category.business

  target:
    - dmg

  artifactName: '${productName}-${version}.${ext}'

  entitlementsInherit: build/entitlements.mac.plist

  extendInfo:
    NSCameraUsageDescription: Application requests access to the device camera.
    NSMicrophoneUsageDescription: Application requests access to the device microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the Downloads folder.

  notarize: false

dmg:
  artifactName: '${productName}-${version}.${ext}'

linux:
  target:
    - AppImage
    - deb

  maintainer: Grocery POS

  category: Office

appImage:
  artifactName: '${productName}-${version}.${ext}'
