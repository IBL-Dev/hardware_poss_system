appId: com.hardwareshop.desktop

productName: Hardware Shop

copyright: Copyright (c) 2026 Hardware Shop

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/hardware_icon.png
  - package.json

extraResources:
  - from: resources/hardware_icon.png
    to: hardware_icon.png

asar: true

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - '**/*.node'

npmRebuild: true

win:
  executableName: Hardware Shop

  target:
    - target: nsis
      arch:
        - x64

  icon: build/icon.ico

nsis:
  artifactName: '${productName}-Setup-${version}.${ext}'

  oneClick: false

  perMachine: false

  allowElevation: true

  allowToChangeInstallationDirectory: true

  createDesktopShortcut: always

  createStartMenuShortcut: true

  shortcutName: Hardware Shop

  uninstallDisplayName: Hardware Shop

  deleteAppDataOnUninstall: false

portable:
  artifactName: '${productName}-Portable-${version}.${ext}'

mac:
  category: public.app-category.business

  target:
    - dmg

  artifactName: '${productName}-${version}.${ext}'

  entitlementsInherit: build/entitlements.mac.plist

  extendInfo:
    NSCameraUsageDescription: Application requests access to the device camera.
    NSMicrophoneUsageDescription: Application requests access to the device microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the Downloads folder.

  notarize: false

dmg:
  artifactName: '${productName}-${version}.${ext}'

linux:
  target:
    - AppImage
    - deb

  maintainer: Hardware Shop

  category: Office

appImage:
  artifactName: '${productName}-${version}.${ext}'
